name: anime_trade_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  lucide_icons: ^0.257.0
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.12.2
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  record: ^6.2.0
  audioplayers: ^6.6.0
  audio_waveforms: ^2.0.2
  image_cropper: ^12.2.0
  purchases_flutter: ^10.0.1
  flutter_local_notifications: ^21.0.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 🔥 Generador de iconos
  flutter_launcher_icons: ^0.13.1

# 🔥 CONFIG ICONOS (IMPORTANTE: fuera de "flutter")
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_1024.png"

flutter_native_splash:
  color: "#0D0D0D"
  image: assets/icon/app_icon_splash_1024.png

  android_12:
    image: assets/icon/app_icon_splash_1024.png
    icon_background_color: "#0D0D0D"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icon/app_icon_1024.png
    - assets/icon/app_icon_splash_1024.png